name: resnet50
source: torchvision
weights: IMAGENET1K_V1          # ImageNet-pretrained, final fully connected layer removed
feature_dim: 2048
input_size: 512
frozen: true
normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
batch_size: 128
gradcam_layer: layer4           # last convolutional block used for Grad-CAM
