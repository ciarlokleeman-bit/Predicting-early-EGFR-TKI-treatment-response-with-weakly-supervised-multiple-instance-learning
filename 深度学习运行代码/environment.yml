name: hemil
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  - openslide
  - openslide-python
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - scikit-image>=0.21
  - statsmodels>=0.14
  - h5py
  - pyyaml
  - tqdm
  - pillow
  - pip
  - pip:
      - timm>=0.9.2
      - lifelines>=0.27
      - opencv-python-headless>=4.8
      - -e .
